name: dotnet format

on: push

jobs:
  check-format:
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.x'

      - name: Check out code
        uses: actions/checkout@v2

      - name: Run dotnet format whitespace
        run: |
          dotnet format whitespace --folder ./client/Assets/Scripts --verify-no-changes
          dotnet format whitespace --folder ./client/Assets/Editor/Scripts --verify-no-changes
