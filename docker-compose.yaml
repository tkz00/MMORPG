services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ${DB_MODE:-ephemeral}:/var/lib/postgresql/data

volumes:
  persist:
  ephemeral:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
